<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">

    <script defer src="./script.js"></script>
</head>
<body>

    <main class="main-section">

        <h1 class="app-name">
            Password Generator
        </h1>

        <form class="form--password-generator" action="#" method="#">

            <div class="container--password">
                <p class="password">PTx1f5DaFX</p>

                <div class="container--icon-copy">
                    <span class="span--copied display-none">copied</span>
                    <svg class="icon-copy svg-icon" width="21" height="24" xmlns="http://www.w3.org/2000/svg"><path d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"/></svg>
                </div>
            </div>

            <div class="container--form-inputs"> 

                <div class="container--input-range">
                    <label for="inp-range" class="label--inp-range">
                        Character Length
                        <span class="span--character-length">10</span>
                    </label>
                    <input type="range" id="inp-range" min="0" max="20">
                </div>

                <div class="container--input-checkbox">

                    <label for="inp-uppercase" class="label--inp-checkbox">
                        <input type="checkbox" class="inp-checkbox" id="inp-uppercase" data-character-type="Uppercase">
                        Include Uppercase Letters
                    </label>

                    <label for="inp-lowercase" class="label--inp-checkbox">
                        <input type="checkbox" class="inp-checkbox" id="inp-lowercase" data-character-type="Lowercase">
                        Include Lowercase Letters
                    </label>

                    <label for="inp-numbers" class="label--inp-checkbox">
                        <input type="checkbox" class="inp-checkbox" id="inp-numbers" data-character-type="Number">
                        Include Numbers 
                    </label>

                    <label for="inp-symbols" class="label--inp-checkbox">
                        <input type="checkbox" class="inp-checkbox" id="inp-symbols" data-character-type="Symbol">
                        Include Symbols 
                    </label>

                </div>

                <div class="container--password-strength">
                    <h5>strength</h5>

                    <div class="container--strength">
                        <span class="span--strength-level">TOO WEAK!</span>

                        <div class="squers">
                            <div  class="squer"></div>
                            <div  class="squer"></div>
                            <div  class="squer"></div>
                            <div  class="squer"></div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn--generate-password">
                    generate
                    <svg class="icon-arrow svg-icon" width="12" height="12" xmlns="http://www.w3.org/2000/svg"><path d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"/></svg>
                </button>
            </div>
        </form>

    </main>

</body>
</html>
